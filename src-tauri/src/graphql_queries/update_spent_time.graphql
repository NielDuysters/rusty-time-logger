mutation UpdateProjectFieldValue(
  $projectId: ID!,
  $itemId: ID!,
  $fieldId: ID!,
  $value: String!
) {
  updateProjectV2ItemFieldValue(
    input: {
      projectId: $projectId
      itemId: $itemId
      fieldId: $fieldId
      value: { text: $value }
    }
  ) {
    projectV2Item {
      id
    }
  }
}

